[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "market-microstructure-toolkit"
version = "0.2.0"
description = "Synthetic OMS lifecycle, cash reservations and crash recovery with microstructure research"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
historical = ["pyarrow>=20,<26"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["market_microstructure*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
