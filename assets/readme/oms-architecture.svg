<svg xmlns="http://www.w3.org/2000/svg" width="720" height="640" viewBox="0 0 720 640" role="img"><title>COMMIT 이후에만 주문을 전달한다</title><rect width="720" height="640" rx="12" fill="#F8FAFC"/><text x="28" y="42" font-family="Apple SD Gothic Neo,Noto Sans CJK KR,sans-serif" font-size="26" font-weight="700" fill="#182C40">COMMIT 이후에만 주문을 전달한다</text><text x="28" y="74" font-family="Apple SD Gothic Neo,Noto Sans CJK KR,sans-serif" font-size="17" font-weight="400" fill="#627487">호출자 → OMS → SQLite의 명령 경계와 보고 경로</text><text x="55" y="125" font-family="Apple SD Gothic Neo,Noto Sans CJK KR,sans-serif" font-size="22" font-weight="700" fill="#2563A6">호출자</text><path d="M90 145 L90 558" stroke="#CBD5E1" stroke-width="2" /><text x="315" y="125" font-family="Apple SD Gothic Neo,Noto Sans CJK KR,sans-serif" font-size="22" font-weight="700" fill="#2563A6">OMS</text><path d="M350 145 L350 558" stroke="#CBD5E1" stroke-width="2" /><text x="575" y="125" font-family="Apple SD Gothic Neo,Noto Sans CJK KR,sans-serif" font-size="22" font-weight="700" fill="#2563A6">SQLite</text><path d="M610 145 L610 558" stroke="#CBD5E1" stroke-width="2" /><path d="M90 185 L350 185" stroke="#2563A6" stroke-width="2" /><circle cx="350" cy="185" r="4" fill="#2563A6"/><text x="105" y="170" font-family="Apple SD Gothic Neo,Noto Sans CJK KR,sans-serif" font-size="19" font-weight="400" fill="#182C40">submit / 주문 검증</text><path d="M350 260 L610 260" stroke="#2563A6" stroke-width="2" stroke-dasharray="6 5" /><circle cx="610" cy="260" r="4" fill="#2563A6"/><text x="365" y="245" font-family="Apple SD Gothic Neo,Noto Sans CJK KR,sans-serif" font-size="19" font-weight="400" fill="#182C40">명령·결과·예약 저장</text><path d="M610 330 L350 330" stroke="#2563A6" stroke-width="2" stroke-dasharray="6 5" /><circle cx="350" cy="330" r="4" fill="#2563A6"/><text x="365" y="315" font-family="Apple SD Gothic Neo,Noto Sans CJK KR,sans-serif" font-size="19" font-weight="400" fill="#182C40">COMMIT 완료</text><path d="M350 405 L90 405" stroke="#2563A6" stroke-width="2" /><circle cx="90" cy="405" r="4" fill="#2563A6"/><text x="105" y="390" font-family="Apple SD Gothic Neo,Noto Sans CJK KR,sans-serif" font-size="19" font-weight="400" fill="#182C40">outgoing 반환</text><path d="M90 515 L350 515" stroke="#2563A6" stroke-width="2" /><circle cx="350" cy="515" r="4" fill="#2563A6"/><text x="105" y="500" font-family="Apple SD Gothic Neo,Noto Sans CJK KR,sans-serif" font-size="19" font-weight="400" fill="#182C40">거래소 보고 전달</text><rect x="30" y="432" width="260" height="45" rx="5" fill="#EAF0F6"/><text x="45" y="461" font-family="Apple SD Gothic Neo,Noto Sans CJK KR,sans-serif" font-size="17" font-weight="700" fill="#2563A6">호출자가 모의 거래소로 전송</text><text x="28" y="594" font-family="Apple SD Gothic Neo,Noto Sans CJK KR,sans-serif" font-size="19" font-weight="700" fill="#182C40">OMS: TradingSession → FixJournal → FundedJournal</text><text x="28" y="623" font-family="Apple SD Gothic Neo,Noto Sans CJK KR,sans-serif" font-size="17" font-weight="400" fill="#627487">실선은 요청·반환·보고, 점선은 저장. 끝점은 수신 측입니다.</text></svg>